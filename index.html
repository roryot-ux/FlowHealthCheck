<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flow Health Check</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: #334155;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --success: #22c55e;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, var(--bg) 60%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 40px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .brand .logo {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  h1 {
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 6px 0 28px;
  }

  .dropzone {
    border: 2px dashed var(--card-border);
    border-radius: 14px;
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }

  .dropzone:hover,
  .dropzone.dragover {
    border-color: var(--accent);
    background: rgba(99, 102, 241, 0.08);
  }

  .dropzone .icon { font-size: 34px; }

  .dropzone p {
    margin: 12px 0 4px;
    font-size: 15px;
  }

  .dropzone .hint {
    color: var(--muted);
    font-size: 13px;
    margin: 0;
  }

  input[type="file"] { display: none; }

  .result {
    margin-top: 24px;
    display: none;
  }

  .result.show { display: block; }

  .success-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(34, 197, 94, 0.12);
    border: 1px solid rgba(34, 197, 94, 0.4);
    color: var(--success);
    padding: 12px 16px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 18px;
  }

  .stat {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: rgba(148, 163, 184, 0.06);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    margin-bottom: 10px;
  }

  .stat .label { color: var(--muted); font-size: 13px; }

  .stat .value {
    font-weight: 600;
    font-size: 15px;
    word-break: break-all;
    text-align: right;
    max-width: 60%;
  }

  .error-banner {
    display: none;
    align-items: center;
    gap: 10px;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: var(--danger);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    margin-top: 18px;
  }

  .error-banner.show { display: flex; }

  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 22px 0 10px;
  }

  .tree {
    background: rgba(148, 163, 184, 0.06);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 8px;
    max-height: 320px;
    overflow: auto;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.9;
  }

  .tree ul {
    list-style: none;
    margin: 0;
    padding-left: 20px;
  }

  .tree > ul { padding-left: 4px; }

  .tree li { white-space: nowrap; }

  .node {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 1px 6px;
    border-radius: 6px;
  }

  .node .ico { font-size: 13px; }

  .node.folder { color: var(--text); font-weight: 600; }
  .node.file { color: var(--muted); font-weight: 400; }

  .node.json {
    color: #fde047;
    background: rgba(250, 204, 21, 0.12);
    border: 1px solid rgba(250, 204, 21, 0.35);
    font-weight: 600;
  }

  .badge {
    display: inline-block;
    margin-left: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #713f12;
    background: #fde047;
    border-radius: 5px;
    padding: 0 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .node.clickable { cursor: pointer; transition: background 0.15s; }
  .node.clickable:hover,
  .node.clickable:focus-visible {
    background: rgba(250, 204, 21, 0.22);
    outline: none;
  }

  /* JSON viewer modal */
  .viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.72);
    backdrop-filter: blur(2px);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .viewer.show { display: flex; }

  .viewer-panel {
    width: 100%;
    max-width: 760px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    overflow: hidden;
  }

  .viewer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--card-border);
  }

  .viewer-title {
    font-weight: 600;
    font-size: 15px;
    word-break: break-all;
    font-family: "SFMono-Regular", Consolas, monospace;
  }

  .viewer-close {
    flex: none;
    background: rgba(148, 163, 184, 0.12);
    border: 1px solid var(--card-border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    transition: background 0.15s;
  }

  .viewer-close:hover { background: rgba(239, 68, 68, 0.2); }

  .viewer-note {
    padding: 0 20px;
    font-size: 13px;
    color: var(--muted);
  }

  .viewer-note.warn {
    color: #fbbf24;
    padding: 12px 20px 0;
  }

  .viewer-body {
    overflow: auto;
    padding: 16px 20px 20px;
  }

  .viewer-loading { color: var(--muted); font-size: 14px; }

  pre.json {
    margin: 0;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre;
    tab-size: 2;
    color: var(--text);
  }

  /* Syntax highlighting */
  .tok-key  { color: #7dd3fc; }
  .tok-str  { color: #86efac; }
  .tok-num  { color: #fca5a5; }
  .tok-bool { color: #c4b5fd; }
  .tok-null { color: #94a3b8; font-style: italic; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">🩺</div>
      <h1>Flow Health Check</h1>
    </div>
    <p class="subtitle">Upload a ZIP file to inspect its contents.</p>

    <label class="dropzone" id="dropzone" for="fileInput">
      <div class="icon">📦</div>
      <p>Click to choose a ZIP file</p>
      <p class="hint">or drag &amp; drop it here</p>
    </label>
    <input type="file" id="fileInput" accept=".zip,application/zip,application/x-zip-compressed" />

    <div class="result" id="result">
      <div class="success-banner">
        <span>✅</span>
        <span>ZIP file processed successfully!</span>
      </div>
      <div class="stat">
        <span class="label">File name</span>
        <span class="value" id="fileName">—</span>
      </div>
      <div class="stat">
        <span class="label">Files inside ZIP</span>
        <span class="value" id="fileCount">—</span>
      </div>
      <div class="stat">
        <span class="label">JSON files</span>
        <span class="value" id="jsonCount">—</span>
      </div>

      <div class="section-title">Contents</div>
      <div class="tree" id="tree"></div>
    </div>

    <div class="error-banner" id="error">
      <span>⚠️</span>
      <span id="errorText">Something went wrong.</span>
    </div>
  </div>

  <!-- JSON viewer modal -->
  <div class="viewer" id="viewer">
    <div class="viewer-panel">
      <div class="viewer-header">
        <span class="viewer-title" id="viewerTitle">file.json</span>
        <button class="viewer-close" id="viewerClose" aria-label="Close">✕</button>
      </div>
      <div class="viewer-note" id="viewerNote"></div>
      <div class="viewer-body" id="viewerBody"></div>
    </div>
  </div>

<script>
  const fileInput = document.getElementById("fileInput");
  const dropzone = document.getElementById("dropzone");
  const result = document.getElementById("result");
  const error = document.getElementById("error");
  const errorText = document.getElementById("errorText");
  const fileNameEl = document.getElementById("fileName");
  const fileCountEl = document.getElementById("fileCount");
  const jsonCountEl = document.getElementById("jsonCount");
  const treeEl = document.getElementById("tree");

  // Holds the currently loaded ZIP so JSON files can be read on click.
  let currentBuffer = null;

  // Drag & drop handling
  ["dragenter", "dragover"].forEach(evt =>
    dropzone.addEventListener(evt, e => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    })
  );
  ["dragleave", "drop"].forEach(evt =>
    dropzone.addEventListener(evt, e => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
    })
  );
  dropzone.addEventListener("drop", e => {
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  fileInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (file) handleFile(file);
  });

  function showError(msg) {
    result.classList.remove("show");
    errorText.textContent = msg;
    error.classList.add("show");
  }

  async function handleFile(file) {
    error.classList.remove("show");
    result.classList.remove("show");

    const looksLikeZip =
      file.name.toLowerCase().endsWith(".zip") ||
      /zip/.test(file.type);
    if (!looksLikeZip) {
      showError("Please upload a .zip file.");
      return;
    }

    try {
      const buffer = await file.arrayBuffer();
      currentBuffer = buffer;
      const entries = readZipEntries(buffer);
      const files = entries.filter(e => !e.isDir);
      const jsonFiles = files.filter(e => e.name.toLowerCase().endsWith(".json"));

      fileNameEl.textContent = file.name;
      fileCountEl.textContent = files.length.toLocaleString();
      jsonCountEl.textContent = jsonFiles.length.toLocaleString();

      renderTree(entries);
      result.classList.add("show");
    } catch (err) {
      showError("Could not read this ZIP file. It may be corrupt or invalid.");
      console.error(err);
    }
  }

  /**
   * Reads a ZIP's central directory and returns an array of
   * { name, isDir } entries. Works fully offline — no libraries.
   */
  function readZipEntries(buffer) {
    const view = new DataView(buffer);
    const bytes = new Uint8Array(buffer);

    // Locate the End Of Central Directory (EOCD) record.
    // Signature 0x06054b50, searched from the end of the file
    // (it sits within the last 65557 bytes because of the comment field).
    const EOCD_SIG = 0x06054b50;
    let eocd = -1;
    const minPos = Math.max(0, buffer.byteLength - 65557 - 22);
    for (let i = buffer.byteLength - 22; i >= minPos; i--) {
      if (view.getUint32(i, true) === EOCD_SIG) {
        eocd = i;
        break;
      }
    }
    if (eocd === -1) throw new Error("Not a valid ZIP file (no EOCD record found).");

    // Offset 16 of EOCD holds the start offset of the central directory.
    let cdOffset = view.getUint32(eocd + 16, true);
    let totalEntries = view.getUint16(eocd + 10, true);

    // Handle ZIP64 (used when entries/offsets exceed 32-bit fields).
    if (cdOffset === 0xffffffff || totalEntries === 0xffff) {
      const locSig = 0x07064b50; // ZIP64 EOCD locator
      const locPos = eocd - 20;
      if (locPos >= 0 && view.getUint32(locPos, true) === locSig) {
        const zip64EocdOffset = Number(view.getBigUint64(locPos + 8, true));
        if (view.getUint32(zip64EocdOffset, true) === 0x06064b50) {
          totalEntries = Number(view.getBigUint64(zip64EocdOffset + 32, true));
          cdOffset = Number(view.getBigUint64(zip64EocdOffset + 48, true));
        }
      }
    }

    // Walk the central directory and collect every entry, including the
    // details needed to locate and decompress each file's data later.
    const CD_SIG = 0x02014b50;
    const decoder = new TextDecoder();
    const entries = [];
    let pos = cdOffset;
    for (let i = 0; i < totalEntries; i++) {
      if (view.getUint32(pos, true) !== CD_SIG) break;
      const method = view.getUint16(pos + 10, true);
      let compressedSize = view.getUint32(pos + 20, true);
      let uncompressedSize = view.getUint32(pos + 24, true);
      const nameLen = view.getUint16(pos + 28, true);
      const extraLen = view.getUint16(pos + 30, true);
      const commentLen = view.getUint16(pos + 32, true);
      let localHeaderOffset = view.getUint32(pos + 42, true);
      const nameBytes = bytes.subarray(pos + 46, pos + 46 + nameLen);
      const name = decoder.decode(nameBytes);

      // If any size/offset is maxed out, the real value lives in the
      // ZIP64 extra field (header id 0x0001).
      if (
        compressedSize === 0xffffffff ||
        uncompressedSize === 0xffffffff ||
        localHeaderOffset === 0xffffffff
      ) {
        let ep = pos + 46 + nameLen;
        const extraEnd = ep + extraLen;
        while (ep + 4 <= extraEnd) {
          const id = view.getUint16(ep, true);
          const size = view.getUint16(ep + 2, true);
          let dp = ep + 4;
          if (id === 0x0001) {
            if (uncompressedSize === 0xffffffff) { uncompressedSize = Number(view.getBigUint64(dp, true)); dp += 8; }
            if (compressedSize === 0xffffffff) { compressedSize = Number(view.getBigUint64(dp, true)); dp += 8; }
            if (localHeaderOffset === 0xffffffff) { localHeaderOffset = Number(view.getBigUint64(dp, true)); dp += 8; }
            break;
          }
          ep += 4 + size;
        }
      }

      entries.push({
        name,
        isDir: name.endsWith("/"),
        method,
        compressedSize,
        uncompressedSize,
        localHeaderOffset,
      });
      pos += 46 + nameLen + extraLen + commentLen;
    }

    return entries;
  }

  /**
   * Extracts a single entry's raw bytes from the ZIP, decompressing
   * it if needed. Uses the browser's built-in DecompressionStream —
   * no external libraries, fully offline.
   */
  async function extractEntryBytes(buffer, entry) {
    const view = new DataView(buffer);
    const off = entry.localHeaderOffset;
    if (view.getUint32(off, true) !== 0x04034b50) {
      throw new Error("Invalid local file header.");
    }
    // The local header's name/extra lengths can differ from the central
    // directory's, so read them here to find where the data really starts.
    const nameLen = view.getUint16(off + 26, true);
    const extraLen = view.getUint16(off + 28, true);
    const dataStart = off + 30 + nameLen + extraLen;
    const compressed = new Uint8Array(buffer, dataStart, entry.compressedSize);

    if (entry.method === 0) {
      // Stored (no compression).
      return compressed;
    }
    if (entry.method === 8) {
      // Deflate.
      if (typeof DecompressionStream === "undefined") {
        throw new Error("This browser can't decompress ZIP entries.");
      }
      const ds = new DecompressionStream("deflate-raw");
      const stream = new Response(compressed).body.pipeThrough(ds);
      const out = await new Response(stream).arrayBuffer();
      return new Uint8Array(out);
    }
    throw new Error("Unsupported compression method (" + entry.method + ").");
  }

  /**
   * Builds a nested folder structure from flat ZIP paths and
   * renders it as an indented tree, highlighting JSON files.
   */
  function renderTree(entries) {
    const root = {};

    for (const entry of entries) {
      const parts = entry.name.split("/").filter(Boolean);
      let node = root;
      parts.forEach((part, idx) => {
        const isLast = idx === parts.length - 1;
        const isFolder = !isLast || entry.isDir;
        if (!node[part]) {
          node[part] = { __folder: isFolder, __children: {} };
        }
        // A path may imply a folder before an explicit folder entry appears.
        if (isFolder) node[part].__folder = true;
        // Attach the ZIP entry to the leaf file node so it can be opened.
        if (isLast && !isFolder) node[part].__entry = entry;
        node = node[part].__children;
      });
    }

    treeEl.innerHTML = "";
    treeEl.appendChild(buildList(root));
  }

  function buildList(node) {
    const ul = document.createElement("ul");
    const names = Object.keys(node).sort((a, b) => {
      const af = node[a].__folder, bf = node[b].__folder;
      if (af !== bf) return af ? -1 : 1; // folders first
      return a.localeCompare(b, undefined, { sensitivity: "base" });
    });

    for (const name of names) {
      const item = node[name];
      const li = document.createElement("li");
      const span = document.createElement("span");
      const isJson = !item.__folder && name.toLowerCase().endsWith(".json");

      span.className = "node " + (item.__folder ? "folder" : isJson ? "file json" : "file");
      span.innerHTML =
        '<span class="ico">' + (item.__folder ? "📁" : isJson ? "🧾" : "📄") + "</span>" +
        '<span class="name"></span>';
      span.querySelector(".name").textContent = name;
      if (isJson) {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "JSON";
        span.appendChild(badge);

        // Clicking a JSON file opens it in the viewer.
        if (item.__entry) {
          span.classList.add("clickable");
          span.setAttribute("role", "button");
          span.setAttribute("tabindex", "0");
          span.addEventListener("click", () => openJson(item.__entry));
          span.addEventListener("keydown", e => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openJson(item.__entry);
            }
          });
        }
      }

      li.appendChild(span);
      if (item.__folder && Object.keys(item.__children).length) {
        li.appendChild(buildList(item.__children));
      }
      ul.appendChild(li);
    }

    return ul;
  }

  // ---- JSON viewer -------------------------------------------------------

  const viewer = document.getElementById("viewer");
  const viewerTitle = document.getElementById("viewerTitle");
  const viewerBody = document.getElementById("viewerBody");
  const viewerNote = document.getElementById("viewerNote");
  const viewerClose = document.getElementById("viewerClose");

  viewerClose.addEventListener("click", closeViewer);
  viewer.addEventListener("click", e => {
    if (e.target === viewer) closeViewer(); // click backdrop to close
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && viewer.classList.contains("show")) closeViewer();
  });

  function closeViewer() {
    viewer.classList.remove("show");
    viewerBody.innerHTML = "";
  }

  async function openJson(entry) {
    viewerTitle.textContent = entry.name;
    viewerNote.textContent = "";
    viewerNote.className = "viewer-note";
    viewerBody.innerHTML = '<div class="viewer-loading">Loading…</div>';
    viewer.classList.add("show");

    try {
      const bytes = await extractEntryBytes(currentBuffer, entry);
      const text = new TextDecoder("utf-8").decode(bytes);

      let pretty;
      try {
        pretty = JSON.stringify(JSON.parse(text), null, 2);
      } catch (parseErr) {
        // Still show the file, but flag that it isn't valid JSON.
        viewerNote.textContent =
          "⚠️ This file could not be parsed as valid JSON — showing raw text.";
        viewerNote.className = "viewer-note warn";
        pretty = text;
      }

      viewerBody.innerHTML =
        '<pre class="json"><code>' + syntaxHighlight(pretty) + "</code></pre>";
    } catch (err) {
      viewerBody.innerHTML = "";
      viewerNote.textContent = "⚠️ Could not open this file: " + err.message;
      viewerNote.className = "viewer-note warn";
      console.error(err);
    }
  }

  /**
   * Wraps JSON tokens in <span> tags for colouring. Input is escaped
   * first so file contents can never inject HTML into the page.
   */
  function syntaxHighlight(json) {
    const escaped = json
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    return escaped.replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      match => {
        let cls = "tok-num";
        if (/^"/.test(match)) {
          cls = /:$/.test(match) ? "tok-key" : "tok-str";
        } else if (/true|false/.test(match)) {
          cls = "tok-bool";
        } else if (/null/.test(match)) {
          cls = "tok-null";
        }
        return '<span class="' + cls + '">' + match + "</span>";
      }
    );
  }
</script>
</body>
</html>
